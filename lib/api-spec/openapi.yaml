openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Alphabet AI - Adaptive K-12 ELA Mastery Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication and user profile
  - name: students
    description: Student profile operations
  - name: skills
    description: ELA skill catalog
  - name: mastery
    description: Skill mastery tracking
  - name: placement
    description: Adaptive placement assessment
  - name: practice
    description: Daily adaptive practice sessions
  - name: teacher
    description: Teacher dashboard and class management
  - name: lessons
    description: Lesson sessions and content
  - name: tts
    description: Text-to-speech
  - name: llm
    description: AI content generation
  - name: analytics
    description: Analytics and progress data

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── AUTH / PROFILE ─────────────────────────────────────────────────────────
  /auth/user:
    get:
      tags: [auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'

  /login:
    get:
      tags: [auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          description: Relative path to redirect to after login (must start with `/`). Defaults to `/`.
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.

  /callback:
    get:
      tags: [auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
            format: uri
      responses:
        '302':
          description: Redirect to the returnTo path on success or /api/login on failure.

  /logout:
    get:
      tags: [auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '302':
          description: Redirect to the OIDC provider logout URL.

  /mobile-auth/token-exchange:
    post:
      tags: [auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileTokenExchangeRequest'
      responses:
        '200':
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenExchangeSuccess'
        '400':
          description: Missing or invalid required fields.
        '401':
          description: Token did not contain usable claims.
        '500':
          description: Token exchange failed.

  /mobile-auth/logout:
    post:
      tags: [auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        '200':
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user profile
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Unauthenticated

  /auth/profile:
    patch:
      operationId: updateProfile
      tags: [auth]
      summary: Update user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  # ── STUDENT PROFILE ────────────────────────────────────────────────────────
  /students/profile:
    get:
      operationId: getStudentProfile
      tags: [students]
      summary: Get student profile for current user
      responses:
        "200":
          description: Student profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentProfile"
        "404":
          description: Not found
    post:
      operationId: createStudentProfile
      tags: [students]
      summary: Create or upsert student profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentProfileInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentProfile"
    patch:
      operationId: updateStudentProfile
      tags: [students]
      summary: Update student profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentProfileUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentProfile"

  /students/dashboard:
    get:
      operationId: getStudentDashboard
      tags: [students]
      summary: Get student dashboard summary
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentDashboard"

  /students/progress:
    get:
      operationId: getStudentProgress
      tags: [students]
      summary: Get student progress over time (grade, weekly XP, mastery timeline)
      responses:
        "200":
          description: Progress data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentProgress"

  /students/progress/weekly-xp:
    get:
      operationId: getWeeklyXp
      tags: [students]
      summary: Get XP earned per day for the last 7 days
      responses:
        "200":
          description: Daily XP breakdown for the past 7 days
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DailyXp"

  /students/progress/timeline:
    get:
      operationId: getMasteryTimeline
      tags: [students]
      summary: Get mastery milestone events ordered by date (when each skill was mastered)
      responses:
        "200":
          description: Ordered list of mastery events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MasteryEvent"

  /students/me/badges:
    get:
      operationId: getMyBadges
      tags: [students]
      summary: Get all badges with earned status for current student
      responses:
        "200":
          description: All badges with earned status
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BadgeStatus"

  # ── ELA SKILL CATALOG ──────────────────────────────────────────────────────
  /skills:
    get:
      operationId: listSkills
      tags: [skills]
      summary: List ELA skills with optional filters
      parameters:
        - in: query
          name: gradeLevel
          schema:
            type: string
        - in: query
          name: domain
          schema:
            type: string
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: active
          schema:
            type: boolean
      responses:
        "200":
          description: List of skills
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ElaSkill"

  /skills/{skillCode}:
    get:
      operationId: getSkill
      tags: [skills]
      summary: Get a single skill by code
      parameters:
        - in: path
          name: skillCode
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Skill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElaSkill"
        "404":
          description: Not found

  /skills/tree:
    get:
      operationId: getSkillTree
      tags: [skills]
      summary: Get skills grouped by grade and domain for skill tree view
      parameters:
        - in: query
          name: gradeLevel
          schema:
            type: string
      responses:
        "200":
          description: Skill tree
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillTree"

  # ── MASTERY ────────────────────────────────────────────────────────────────
  /mastery:
    get:
      operationId: listMastery
      tags: [mastery]
      summary: List skill mastery records for current student
      parameters:
        - in: query
          name: domain
          schema:
            type: string
        - in: query
          name: masteryLevel
          schema:
            type: string
      responses:
        "200":
          description: Mastery records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SkillMastery"

  /mastery/{skillCode}:
    get:
      operationId: getMastery
      tags: [mastery]
      summary: Get mastery for a specific skill
      parameters:
        - in: path
          name: skillCode
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Mastery record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillMastery"
        "404":
          description: Not found

  /mastery/{skillCode}/record:
    post:
      operationId: recordAnswer
      tags: [mastery]
      summary: Record a practice answer and update mastery
      parameters:
        - in: path
          name: skillCode
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswerRecord"
      responses:
        "200":
          description: Updated mastery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillMastery"

  /mastery/summary:
    get:
      operationId: getMasterySummary
      tags: [mastery]
      summary: Get mastery summary by domain
      responses:
        "200":
          description: Mastery summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MasterySummary"

  # ── ADAPTIVE PLACEMENT ─────────────────────────────────────────────────────
  /placement/start:
    post:
      operationId: startPlacement
      tags: [placement]
      summary: Start a new adaptive placement session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlacementStartInput"
      responses:
        "201":
          description: New placement session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlacementSession"

  /placement/{sessionId}/question:
    get:
      operationId: getNextPlacementQuestion
      tags: [placement]
      summary: Get the next adaptive question for placement
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Next question
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdaptiveQuestion"
        "204":
          description: Assessment complete

  /placement/{sessionId}/answer:
    post:
      operationId: submitPlacementAnswer
      tags: [placement]
      summary: Submit answer for placement question
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlacementAnswer"
      responses:
        "200":
          description: Answer result with updated theta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlacementAnswerResult"

  /placement/{sessionId}/result:
    get:
      operationId: getPlacementResult
      tags: [placement]
      summary: Get placement result after completion
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Placement result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlacementResult"

  # ── DAILY PRACTICE ─────────────────────────────────────────────────────────
  /practice/session:
    post:
      operationId: startPracticeSession
      tags: [practice]
      summary: Start a new daily practice session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PracticeSessionInput"
      responses:
        "201":
          description: New practice session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PracticeSession"

  /practice/session/{sessionId}/activity:
    get:
      operationId: getNextActivity
      tags: [practice]
      summary: Get the next activity in practice session
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Next activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PracticeActivity"
        "204":
          description: Session complete

  /practice/session/{sessionId}/submit:
    post:
      operationId: submitActivityAnswer
      tags: [practice]
      summary: Submit answer for practice activity
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityAnswer"
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityResult"

  /practice/session/{sessionId}/complete:
    post:
      operationId: completePracticeSession
      tags: [practice]
      summary: Mark practice session as complete
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteSessionInput"
      responses:
        "200":
          description: Completed session summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PracticeSession"

  /practice/history:
    get:
      operationId: getPracticeHistory
      tags: [practice]
      summary: Get recent practice session history
      responses:
        "200":
          description: Practice history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PracticeSession"

  # ── INTERVENTION ───────────────────────────────────────────────────────────
  /intervention/pathway:
    get:
      operationId: getInterventionPathway
      tags: [students]
      summary: Get intervention pathway for current student
      responses:
        "200":
          description: Intervention pathway
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterventionPathway"

  /students/intervention:
    get:
      operationId: getReteachingSkills
      tags: [students]
      summary: Get skills flagged for reteaching (needsReteaching = true), grouped by domain
      responses:
        "200":
          description: Reteaching skill groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReteachingSkillGroup"

  /students/reteaching/{skillCode}/complete:
    post:
      operationId: completeReteaching
      tags: [students]
      summary: Complete a reteaching session; clears needsReteaching if score >= 2/3
      parameters:
        - in: path
          name: skillCode
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReteachCompleteInput"
      responses:
        "200":
          description: Updated mastery record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReteachCompleteResult"

  /ai/reteach:
    post:
      operationId: generateReteachLesson
      tags: [llm]
      summary: Generate a 3-part micro-lesson for a skill needing reteaching
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReteachLessonInput"
      responses:
        "200":
          description: Generated micro-lesson
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReteachLesson"

  # ── TEACHER ────────────────────────────────────────────────────────────────
  /teacher/classes:
    get:
      operationId: listTeacherClasses
      tags: [teacher]
      summary: List classes for current teacher
      responses:
        "200":
          description: Classes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeacherClass"
    post:
      operationId: createTeacherClass
      tags: [teacher]
      summary: Create a new class
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeacherClassInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherClass"

  /teacher/classes/{classId}:
    get:
      operationId: getTeacherClass
      tags: [teacher]
      summary: Get class details
      parameters:
        - in: path
          name: classId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Class
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherClass"

  /teacher/classes/{classId}/students:
    get:
      operationId: listClassStudents
      tags: [teacher]
      summary: List students enrolled in a class
      parameters:
        - in: path
          name: classId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Students with mastery summary
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudentRosterEntry"

  /teacher/classes/{classId}/heatmap:
    get:
      operationId: getClassHeatmap
      tags: [teacher]
      summary: Get standards mastery heatmap for a class
      parameters:
        - in: path
          name: classId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Heatmap data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassHeatmap"

  /teacher/dashboard:
    get:
      operationId: getTeacherDashboard
      tags: [teacher]
      summary: Get teacher dashboard summary
      responses:
        "200":
          description: Teacher dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherDashboard"

  /teacher/alerts:
    get:
      operationId: listTeacherAlerts
      tags: [teacher]
      summary: List intervention alerts for teacher
      responses:
        "200":
          description: Alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeacherAlert"

  # ── LESSONS / CONTENT ──────────────────────────────────────────────────────
  /lessons:
    get:
      operationId: listLessons
      tags: [lessons]
      summary: List lesson sessions
      responses:
        "200":
          description: Lessons
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LessonSession"

  /lessons/generate:
    post:
      operationId: generateLesson
      tags: [lessons]
      summary: Generate a lesson from uploaded book content
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LessonGenerateInput"
      responses:
        "201":
          description: Generated lesson
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LessonSession"

  # ── TTS ────────────────────────────────────────────────────────────────────
  /tts:
    post:
      operationId: textToSpeech
      tags: [tts]
      summary: Convert text to speech audio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TtsInput"
      responses:
        "200":
          description: Audio data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TtsResult"

  # ── AI CONTENT GENERATION ──────────────────────────────────────────────────
  /llm/generate-question:
    post:
      operationId: generateQuestion
      tags: [llm]
      summary: Generate an adaptive practice question
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestionGenerateInput"
      responses:
        "200":
          description: Generated question
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdaptiveQuestion"

  /llm/generate-exercise:
    post:
      operationId: generateExercise
      tags: [llm]
      summary: Generate a set of exercises for a skill
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExerciseGenerateInput"
      responses:
        "200":
          description: Generated exercises
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdaptiveQuestion"

  # ── ANALYTICS ─────────────────────────────────────────────────────────────
  /analytics/student:
    get:
      operationId: getStudentAnalytics
      tags: [analytics]
      summary: Get analytics for current student
      responses:
        "200":
          description: Student analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentAnalytics"

  /analytics/class/{classId}:
    get:
      operationId: getClassAnalytics
      tags: [analytics]
      summary: Get analytics for a class
      parameters:
        - in: path
          name: classId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Class analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassAnalytics"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    # ── REPLIT AUTH ──────────────────────────────────────────────────────────
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl, role]
      properties:
        id:
          type: string
        email:
          type: ["string", "null"]
          format: email
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        profileImageUrl:
          type: ["string", "null"]
        role:
          type: string

    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'

    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code:
          type: string
          minLength: 1
        code_verifier:
          type: string
          minLength: 1
        redirect_uri:
          type: string
          minLength: 1
          format: uri
        state:
          type: string
          minLength: 1
        nonce:
          type: string
          minLength: 1

    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token:
          type: string

    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true

    # ── USER / AUTH ───────────────────────────────────────────────────────────
    UserProfile:
      type: object
      required: [id, role, email]
      properties:
        id:
          type: string
        email:
          type: string
        displayName:
          type: ["string", "null"]
        role:
          type: string
          enum: [student, teacher, caregiver, admin]
        createdAt:
          type: string

    ProfileUpdate:
      type: object
      properties:
        displayName:
          type: string
        role:
          type: string
          enum: [student, teacher, caregiver, admin]

    # ── STUDENT PROFILE ───────────────────────────────────────────────────────
    StudentProfile:
      type: object
      required: [id, userId, displayName, grade]
      properties:
